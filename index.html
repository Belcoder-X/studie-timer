<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Studie-Timer Dashboard</title>
    <style>
        body { background: #0f172a; color: #f8fafc; font-family: 'Segoe UI', sans-serif; max-width: 750px; margin: 40px auto; padding: 20px; text-align: center; }
        .klok { font-size: 64px; font-weight: bold; font-variant-numeric: tabular-nums; margin: 20px 0; color: #38bdf8; }
        button { padding: 14px 32px; font-size: 18px; font-weight: bold; border: none; border-radius: 10px; cursor: pointer; margin: 0 8px; }
        .btn-start { background: #22c55e; color: white; }
        .btn-stop { background: #ef4444; color: white; }
        .stats { display: flex; justify-content: center; gap: 20px; margin: 30px 0; }
        .card { background: #1e293b; padding: 16px 28px; border-radius: 12px; min-width: 150px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #1e293b; border-radius: 12px; overflow: hidden; }
        th, td { padding: 12px; border-bottom: 1px solid #334155; }
        th { background: #334155; color: #94a3b8; }
    </style>
</head>
<body>
    <h1>⏱️ Mijn Studie-Timer</h1>
    <div class="klok" id="klok">00:00:00</div>

    <button class="btn-start" onclick="startTimer()">▶ Start</button>
    <button class="btn-stop" onclick="stopTimer()">⏹ Stop</button>
    <p id="status" style="color: #94a3b8; margin-top: 15px;">Klaar om te starten...</p>

    <div class="stats">
        <div class="card"><div style="color:#94a3b8">Totaal Uren</div><h2 id="uren">0</h2></div>
        <div class="card"><div style="color:#94a3b8">Totaal Minuten</div><h2 id="minuten">0</h2></div>
        <div class="card"><div style="color:#94a3b8">Sessies</div><h2 id="aantal">0</h2></div>
    </div>

    <table>
        <thead>
            <tr><th>#</th><th>Datum</th><th>Start</th><th>Eind</th><th>Duur (min)</th></tr>
        </thead>
        <tbody id="tabel-body"></tbody>
    </table>

    <script>
        let seconden = 0;
        let interval = null;

        function updateKlok() {
            const u = String(Math.floor(seconden / 3600)).padStart(2, '0');
            const m = String(Math.floor((seconden % 3600) / 60)).padStart(2, '0');
            const s = String(seconden % 60).padStart(2, '0');
            document.getElementById("klok").innerText = `${u}:${m}:${s}`;
        }

        async function laadOverzicht() {
            const res = await fetch("/overzicht");
            const data = await res.json();
            const sessies = data.alle_sessies || [];
            let totMin = 0;
            const tbody = document.getElementById("tabel-body");
            tbody.innerHTML = "";

            sessies.slice().reverse().forEach(r => {
                if (r[4] !== null) totMin += r[4];
                tbody.innerHTML += `<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3] || "Loopt..."}</td><td>${r[4] !== null ? r[4] + " min" : "-"}</td></tr>`;
            });

            document.getElementById("minuten").innerText = totMin;
            document.getElementById("uren").innerText = (totMin / 60).toFixed(2);
            document.getElementById("aantal").innerText = sessies.length;
        }

        async function startTimer() {
            const res = await fetch("/start", { method: "POST" });
            const data = await res.json();
            document.getElementById("status").innerText = data.bericht;
            if (!data.bericht.includes("al een timer") && !interval) {
                seconden = 0;
                interval = setInterval(() => { seconden++; updateKlok(); }, 1000);
            }
            laadOverzicht();
        }

        async function stopTimer() {
            const res = await fetch("/stop", { method: "POST" });
            const data = await res.json();
            document.getElementById("status").innerText = data.bericht;
            clearInterval(interval);
            interval = null;
            laadOverzicht();
        }

        laadOverzicht();
    </script>
</body>
</html>
